name: Build And Deploy

'on':
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and build JAR
        run: mvn -ntp --batch-mode clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy:
    needs: build-and-push
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync config files
        run: |
          rsync -az docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          rsync -az --delete haproxy/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/haproxy/"
          rsync -az --delete monitoring/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/monitoring/"

      - name: Create site.pem
        run: |
          set -euo pipefail
          trap 'rm -f key.pem site.pem' EXIT
          umask 077
          printf '%s\n' "${{ secrets.SSL_PRIVATE_KEY }}" > key.pem
          cat key.pem haproxy/fullchain.pem > site.pem
          rsync -az site.pem \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/haproxy/"

      - name: Deploy
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"
          set -a
          source .env
          set +a
          export IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          envsubst < haproxy/haproxy.tmpl > haproxy/haproxy.cfg
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin
          docker pull "$IMAGE"
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF
