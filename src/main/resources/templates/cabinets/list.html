<!-- htmlhint-disable link-rel-canonical-require main-require -->
<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Перечень кабинетов">
    <title th:text="${pageTitle}">Кабинеты</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row">
        <div>
            <h1>Кабинеты</h1>
            <p class="page-subtitle">Управление кабинетами школы</p>
        </div>
        <a class="btn-primary"
           style="display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;text-decoration:none;"
           th:href="@{/schools/{s}/buildings/{b}/cabinets/create(s=${school.uid()},b=${building.uid()})}">
            <svg fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 style="width:15px;height:15px;"
                 viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <line x1="12" x2="12" y1="5" y2="19"/>
                <line x1="5" x2="19" y1="12" y2="12"/>
            </svg>
            Добавить кабинет
        </a>
    </div>

    <div class="search-wrap" style="width:100%;max-width:320px;margin-bottom:1.25rem;">
        <svg fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" x2="16.65" y1="21" y2="16.65"/>
        </svg>
        <label for="cabinet-search">
            <input id="cabinet-search"
                   type="text"
                   placeholder="Поиск кабинета..."
                   th:value="${param.name != null ? param.name[0] : ''}">
            </input>
        </label>
    </div>

    <th:block th:fragment="cabinets-grid">
        <div id="cabinets-results">
            <div class="card-grid" id="cabinets-container">
                <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted-fg);"
                     th:if="${#lists.isEmpty(cabinets)}">
                    Кабинеты не найдены.
                    <a style="color:var(--primary);font-weight:600;text-decoration:underline;margin-left:.25rem;"
                       th:href="@{/schools/{s}/buildings/{b}/cabinets/create(s=${school.uid()},b=${building.uid()})}">
                        Добавить первый
                    </a>
                </div>
                <div class="card-item cabinet-row"
                     style="cursor:pointer;"
                     th:data-id="${item.uid()}"
                     th:data-name="${item.name().toLowerCase()}"
                     th:each="item : ${cabinets}">
                    <div class="card-item-header">
                        <div class="card-item-title-row">
                            <div class="card-item-icon">
                                <svg fill="none"
                                     stroke="currentColor"
                                     stroke-width="2"
                                     viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <rect height="18" rx="1" width="10" x="7" y="3"/>
                                    <circle cx="14" cy="12" fill="currentColor" r="0.8"/>
                                    <path d="M9 7h4"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="card-item-period">
                        <span class="card-item-name" th:text="${item.name()}">Кабинет</span>
                        <div class="card-item-period-label">
                            ID:
                            <span class="td-mono" th:text="${item.uid()}">1</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pagination-wrap" id="cabinets-pagination">
                <div class="pagination-pages">
                    <a class="pagination-btn pagination-prev"
                       href="#"
                       th:data-limit="${limit}"
                       th:data-offset="${page - 1}"
                       th:if="${hasPrev}">
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             style="width:14px;height:14px;"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </a>
                    <th:block
                        th:if="${totalPages > 1}"
                        th:with="start=${page > 3 ? page - 2 : 1},end=${page + 2 <= totalPages ? page + 2 : totalPages},end=${end < 5 ? (totalPages < 5 ? totalPages : 5) : end}">
                        <th:block th:if="${start > 1}">
                            <a class="pagination-btn"
                               href="#"
                               th:data-limit="${limit}"
                               th:data-offset="1">1</a>
                            <span class="pagination-ellipsis" th:if="${start > 2}">…</span>
                        </th:block>
                        <th:block th:each="p : ${#numbers.sequence(start, end)}">
                            <a class="pagination-btn"
                               href="#"
                               th:classappend="${p == page} ? 'active' : ''"
                               th:data-limit="${limit}"
                               th:data-offset="${p}"
                               th:text="${p}">1</a>
                        </th:block>
                        <th:block th:if="${end < totalPages}">
                            <span class="pagination-ellipsis" th:if="${end < totalPages - 1}">…</span>
                            <a class="pagination-btn"
                               href="#"
                               th:data-limit="${limit}"
                               th:data-offset="${totalPages}"
                               th:text="${totalPages}">N</a>
                        </th:block>
                    </th:block>
                    <a class="pagination-btn pagination-next"
                       href="#"
                       th:data-limit="${limit}"
                       th:data-offset="${page + 1}"
                       th:if="${hasNext}" >
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             style="width:14px;height:14px;"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>
                </div>
                <div class="pagination-size" th:if="${limit >= 15}">
                    <span class="pagination-size-label">На странице:</span>
                    <a class="pagination-size-btn"
                       href="#"
                       th:classappend="${limit == s} ? 'active' : ''"
                       th:data-limit="${s}"
                       th:data-offset="1"
                       th:each="s : ${#arrays.toArray({15, 30, 50})}"
                       th:text="${s}">15</a>
                </div>
            </div>
        </div>
    </th:block>
</div>
<th:block layout:fragment="page-scripts">
    <script type="module" th:src="@{/js/cabinets.js}"></script>
</th:block>
</body>
</html>
