<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Добавление кабинета">
    <title>Новый кабинет</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content: center;">
        <div style="display:flex;align-items:center;gap:1rem;">
            <div>
                <h1 style="margin:0;">Новый кабинет</h1>
                <p class="page-subtitle">Заполните данные для создания кабинета</p>
            </div>
        </div>
    </div>
    <div class="error-message" th:if="${param.error}">
        Название не может быть пустым
    </div>
    <div style="max-width:480px; margin: 0 auto;">
        <form method="post"
              style="display:flex;flex-direction:column;gap:1rem;"
              th:action="@{/schools/{s}/buildings/{b}/cabinets/create(s=${school.uid()},b=${building.uid()})}">
            <label for="cabinet-name"
                   style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Название кабинета
                <input id="cabinet-name"
                       name="name"
                       type="text"
                       autofocus="autofocus"
                       placeholder="Например: Кабинет 301"
                       required="required">
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a class="btn-outline-action"
                   href="#"
                   title="Отменить создание кабинета"
                   th:href="@{/schools/{s}/buildings/{b}/cabinets(s=${school.uid()},b=${building.uid()})}">
                    Отмена
                </a>
                <button class="btn-primary" type="submit">Создать</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
