<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Доступ к ресурсу запрещен">
    <title>403 — Schoodule</title>
    <link rel="stylesheet" th:href="@{/css/shadcn.css}">
    <link rel="stylesheet" th:href="@{/css/403.css}">
    <link type="image/png" rel="icon" href="/favicon.svg">
</head>
<body>
    <main>
        <div class="error-page">
            <div class="error-card">
                <span class="error-code">403</span>
                <h1 class="error-title">Доступ запрещён</h1>
                <p class="error-desc">У вас нет прав для просмотра этой страницы.</p>
                <a class="btn btn-outline-custom"
                   href="javascript:history.back()"
                   title="Вернуться на предыдущую страницу">
                    Назад
                </a>
            </div>
        </div>
    </main>
    <footer class="error-footer">
        <span class="error-footer-logo">Schoodule</span>
        <span class="error-footer-copy">© 2026</span>
    </footer>
</body>
</html>
