<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Планирование нагрузки у школьных классов">
    <title th:text="|${schedule.name()} - Учебная нагрузка|">Учебная нагрузка</title>
    <link rel="stylesheet" th:href="@{/css/planning.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="planning-container">
        <div class="planning-header">
            <h1 th:text="${schedule.name()}">Расписание</h1>
        </div>
        <nav class="planning-tabs">
            <a class="tab-link active"
               href="#"
               title="Перейти к учебной нагрузке для школьных классов"
               th:href="@{/schools/{schoolId}/schedules/{scheduleId}/loads(schoolId=${school.uid()},scheduleId=${schedule.uid()})}">
                Учебная нагрузка
            </a>
        </nav>

        <div class="section-header">
            <h2>Учебная нагрузка</h2>
            <button class="btn-add"
                    type="submit"
                    onclick="document.getElementById('add-modal').style.display='flex'">+ Добавить</button>
        </div>
        <div class="error-message" th:if="${param.error}" th:text="${param.error}">Ошибка</div>
        <table class="data-table">
            <thead>
            <tr>
                <th>Класс</th>
                <th>Предмет</th>
                <th>Часов/неделю</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(loads)}">
                <td class="empty-state" colspan="4">Нет данных. Добавьте нагрузку.</td>
            </tr>
            <tr th:each="load : ${loads.list()}">
                <td th:text="${load.schoolClass().name()}">5А</td>
                <td th:text="${load.subject().name()}">Математика</td>
                <td th:text="${load.hoursPerWeek()}">5</td>
                <td>
                    <form method="post"
                          onsubmit="return confirm('Удалить нагрузку?')"
                          style="display: inline;"
                          th:action="@{/schools/{schoolId}/schedules/{scheduleId}/loads/{loadId}/delete(schoolId=${school.uid()},scheduleId=${schedule.uid()},loadId=${load.uid()})}">
                        <button class="btn-action btn-delete" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('add-modal').style.display='none'">&times;</span>
            <h2>Добавить нагрузку</h2>
            <form method="post"
                  th:action="@{/schools/{schoolId}/schedules/{scheduleId}/loads/create(schoolId=${school.uid()},scheduleId=${schedule.uid()})}">
                <label>
                    Класс
                    <select name="clazz" required="required">
                        <option value="">Выберите класс</option>
                        <option th:each="cls : ${classes.list()}"
                                th:text="${cls.name()}"
                                th:value="${cls.uid()}">5А</option>
                    </select>
                </label>
                <label>
                    Предмет
                    <select name="subject" required="required">
                        <option value="">Выберите предмет</option>
                        <option th:each="subj : ${subjects.list()}"
                                th:text="${subj.name()}"
                                th:value="${subj.uid()}">Математика</option>
                    </select>
                </label>
                <label for="hours-name">
                    Часов в неделю
                    <input id="hours-name"
                           name="hours"
                           type="number"
                           max="10"
                           min="1"
                           required="required">
                </label>
                <button class="btn-submit" type="submit">Сохранить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
