<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Добавление учителя">
    <title>Новый учитель</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content:center;">
        <div style="display:flex;align-items:center;gap:1rem;">
            <div>
                <h1 style="margin:0;">Новый учитель</h1>
                <p class="page-subtitle">Заполните данные для добавления учителя</p>
            </div>
        </div>
    </div>
    <div class="error-message" th:if="${param.error}">
        Имя не может быть пустым
    </div>
    <div style="max-width:480px;margin:0 auto;">
        <form method="post"
              style="display:flex;flex-direction:column;gap:1rem;"
              th:action="@{/schools/{id}/teachers/create(id=${school.uid()})}">
            <label style="display:flex;flex-direction:column;gap:.375rem;
                          font-size:.875rem;font-weight:500;">
                ФИО учителя
                <input name="name"
                       type="text"
                       autofocus="autofocus"
                       placeholder="Например: Иванов Иван Иванович"
                       required="required"/>
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a class="btn-outline-action"
                   th:href="@{/schools/{id}/teachers(id=${school.uid()})}">Отмена</a>
                <button class="btn-primary" type="submit">Добавить</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
