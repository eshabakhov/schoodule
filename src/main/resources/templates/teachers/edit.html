<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Редактирование информации об учителе">
    <title>Редактировать учителя</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content:center;">
        <div style="display:flex;align-items:center;gap:1rem;">
            <div>
                <h1 style="margin:0;">Редактировать учителя</h1>
                <p class="page-subtitle" th:text="${teacher.name()}">Иванов Иван Иванович</p>
            </div>
        </div>
    </div>
    <div class="error-message" th:if="${param.error}">
        Имя не может быть пустым
    </div>
    <div style="max-width:480px;margin:0 auto;">
        <form method="post"
              style="display:flex;flex-direction:column;gap:1rem;"
              th:action="@{/schools/{s}/teachers/{t}/edit(s=${school.uid()},t=${teacher.uid()})}">
            <label for="teacher-name"
                   style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                ФИО учителя
                <input id="teacher-name"
                       name="name"
                       type="text"
                       autofocus="autofocus"
                       required="required"
                       th:value="${teacher.name()}">
                </input>
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a class="btn-outline-action"
                   th:href="@{/schools/{s}/teachers/{t}(s=${school.uid()},t=${teacher.uid()})}">Отмена</a>
                <button class="btn-primary" type="submit">Сохранить</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
