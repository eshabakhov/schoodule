<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Добавление корпуса">
    <title>Новый корпус</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content: center;">
        <div style="display:flex;align-items:center;gap:1rem;">
            <div>
                <h1 style="margin:0;">Новый корпус</h1>
                <p class="page-subtitle">Заполните данные для создания корпуса</p>
            </div>
        </div>
    </div>
    <div class="error-message" th:if="${param.error}">
        Название не может быть пустым
    </div>
    <div style="max-width:480px; margin: 0 auto;">
        <form method="post"
              style="display:flex;flex-direction:column;gap:1rem;"
              th:action="@{/schools/{id}/buildings/create(id=${school.uid()})}">
            <label for="building-name"
                   style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Название корпуса
                <input id="building-name"
                       name="name"
                       type="text"
                       autofocus="autofocus"
                       placeholder="Например: Корпус 1"
                       required="required">
                </input>
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a class="btn-outline-action" th:href="@{/schools/{id}/buildings(id=${school.uid()})}">Отмена</a>
                <button class="btn-primary" type="submit">Создать</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
