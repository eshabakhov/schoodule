<!-- htmlhint-disable link-rel-canonical-require -->
<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Справочная информация о корпусе">
    <title th:text="${pageTitle}">Корпус</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="title-with-action">
                <span th:text="${building.name()}">Корпус</span>
                <a class="btn-icon-edit"
                   title="Редактировать"
                   aria-label="Редактировать"
                   th:href="@{/schools/{s}/buildings/{c}/edit(s=${school.uid()},c=${building.uid()})}">
                    <svg fill="none"
                         height="15"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24"
                         width="15"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </a>
            </h1>
            <p class="page-subtitle">Информация о корпусе</p>
        </div>
    </div>
    <div class="school-info">
        <div class="info-row">
            <span class="info-label">ID:</span>
            <span class="info-value" th:text="${building.uid()}">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Название:</span>
            <span class="info-value" th:text="${building.name()}">Корпус</span>
        </div>
    </div>
    <div class="details-footer-actions">
        <button class="btn-outline-action btn-delete-row"
                type="submit"
                style="color:var(--destructive);border-color:#fecaca;background:#fef2f2;"
                th:data-id="${building.uid()}"
                th:data-name="${building.name()}">
            Удалить
        </button>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script th:inline="javascript">
        const schoolId = /*[[${school.uid()}]]*/ 0;
    </script>
    <script>
        $(() => {
            $(document).on('click', '.btn-delete-row', function() {
                const id = $(this).data('id');
                const name = $(this).data('name');
                if (!confirm(`Удалить «${name}»? Это действие нельзя отменить.`)) return;
                $.ajax({
                    url: `/api/schools/${schoolId}/buildings/${id}`,
                    method: 'DELETE',
                    headers: { version: 'SIMPLE' }
                })
                    .done(() => {
                        window.location.href = `/schools/${schoolId}/buildings`;
                    })
                    .fail(() => alert('Не удалось удалить корпус'));
            });
        });
    </script>
</th:block>
</body>
</html>
