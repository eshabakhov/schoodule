<!-- htmlhint-disable link-rel-canonical-require main-require -->
<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Справочная информация о федеральном учебном плане">
    <title th:text="${curriculum['title']}">Федеральный учебный план</title>
    <link rel="stylesheet" th:href="@{/css/federal-curriculum-details.css}">
</head>
<body>
<div layout:fragment="content">
    <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a class="breadcrumb-link"
           href="/federal/curriculums"
           title="Перейти к федеральным учебным планам"
           th:href="@{/federal/curriculums}">
            Федеральные учебные планы
        </a>
        <span class="breadcrumb-separator">-&gt;</span>
        <span class="breadcrumb-current" th:text="${curriculum['title']}">Федеральный учебный план</span>
    </nav>
    <div class="page-title-row" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="title-with-action">
                <span th:text="${curriculum['title']}">Федеральный учебный план</span>
                <a class="btn-icon-edit"
                   href="#"
                   title="Редактировать"
                   aria-label="Редактировать"
                   sec:authorize="hasRole('ADMIN')"
                   th:href="@{/federal/curriculums/{cid}/edit(cid=${curriculum['id']})}">
                    <svg fill="none"
                         height="15"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24"
                         width="15"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </a>
            </h1>
            <p class="page-subtitle">Информация о федеральном учебном плане</p>
        </div>
    </div>
    <div class="school-info">
        <div class="info-row">
            <span class="info-label">ID:</span>
            <span class="info-value" th:text="${curriculum['id']}">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Уровень:</span>
            <span class="info-value" th:text="${curriculum['level']}">BASIC</span>
        </div>
        <div class="info-row">
            <span class="info-label">Неделя:</span>
            <span class="info-value" th:text="${curriculum['week']}">FIVE_DAYS</span>
        </div>
        <div class="info-row">
            <span class="info-label">Версия:</span>
            <span class="info-value" th:text="${curriculum['version']}">v1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Учебный год:</span>
            <span class="info-value" th:text="${curriculum['year']}">2026/2027</span>
        </div>
        <div class="info-row">
            <span class="info-label">Описание:</span>
            <span class="info-value" th:text="${curriculum['description']} ?: '—'">—</span>
        </div>
        <div class="info-row">
            <span class="info-label">Требования:</span>
            <span class="info-value">
                <a class="req-info-link"
                   href="#"
                   title="Перейти к требованиям учебного плана"
                   th:href="@{/federal/curriculums/{cid}/requirements(cid=${curriculum['id']})}">
                    Перейти к требованиям учебного плана
                </a>
            </span>
        </div>
    </div>
    <div class="details-footer-actions" sec:authorize="hasRole('ADMIN')">
        <button class="btn-outline-action btn-delete-curriculum"
                type="submit"
                style="color:var(--destructive);border-color:#fecaca;background:#fef2f2;"
                th:data-id="${curriculum['id']}"
                th:data-name="${curriculum['title']}">
            Удалить план
        </button>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script type="module" th:src="@{/js/federal-curriculums.js}"></script>
</th:block>
</body>
</html>
