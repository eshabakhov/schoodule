<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      layout:decorate="~{base}">
<head>
    <title th:text="${pageTitle}">Федеральный учебный план</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="title-with-action">
                <span th:text="${title}">Федеральный учебный план</span>
                <a th:href="@{/federal/curriculums/{cid}/edit(cid=${id})}"
                   class="btn-icon-edit"
                   title="Редактировать"
                   aria-label="Редактировать"
                   sec:authorize="hasRole('ADMIN')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                         fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </a>
            </h1>
            <p class="page-subtitle">Информация о школе</p>
        </div>
    </div>
    <div class="school-info">
        <div class="info-row">
            <span class="info-label">ID:</span>
            <span class="info-value" th:text="${id}">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Уровень:</span>
            <span class="info-value" th:text="${level}">BASIC</span>
        </div>
        <div class="info-row">
            <span class="info-label">Неделя:</span>
            <span class="info-value" th:text="${week}">FIVE_DAYS</span>
        </div>
        <div class="info-row">
            <span class="info-label">Версия:</span>
            <span class="info-value" th:text="${version}">v1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Учебный год:</span>
            <span class="info-value" th:text="${year}">2026/2027</span>
        </div>
        <div class="info-row">
            <span class="info-label">Описание:</span>
            <span class="info-value" th:text="${description} ?: '—'">—</span>
        </div>
    </div>

    <div class="section-header" style="margin-top:2rem;">
        <h2>Требования учебного плана</h2>
    </div>
    <form th:action="@{/federal/curriculums/{cid}/requirements/create(cid=${id})}"
          method="post"
          style="display:grid;grid-template-columns:80px 1fr 140px 170px auto;gap:.75rem;margin-top:1rem;">
        <input type="number" name="grade" min="1" max="11" placeholder="Класс" required/>
        <input type="text" name="subjectName" placeholder="Предмет" required/>
        <input type="number" name="weeklyHours" min="1" placeholder="Часы" required/>
        <select name="partType" required>
            <option th:each="part : ${partTypes}" th:value="${part}" th:text="${part}">MANDATORY</option>
        </select>
        <button type="submit" class="btn-primary">Добавить</button>
    </form>

    <table class="data-table">
        <thead>
        <tr>
            <th>Класс</th>
            <th>Предмет</th>
            <th>Часов/неделю</th>
            <th>Часть</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(requirements)}">
            <td colspan="5" class="empty-state">Требования пока не добавлены.</td>
        </tr>
        <!--
            Each item in requirements is a Map<String, Object>
            printed by FcrPostgres via ThymeleafMedia.
            Keys: id, grade, subjectName, weeklyHours, partType
        -->
        <tr th:each="item : ${requirements}">
            <td th:text="${item['grade']}">5</td>
            <td th:text="${item['subjectName']}">Математика</td>
            <td th:text="${item['weeklyHours']}">5</td>
            <td th:text="${item['partType']}">MANDATORY</td>
            <td>
                <details>
                    <summary class="btn-outline-action" style="cursor:pointer;display:inline-flex;">Изменить</summary>
                    <form th:action="@{/federal/curriculums/{cid}/requirements/{rid}/edit(cid=${id},rid=${item['id']})}"
                          method="post"
                          style="display:grid;grid-template-columns:80px 1fr 120px 160px auto;gap:.5rem;margin-top:.75rem;">
                        <input type="number" name="grade" min="1" max="11"
                               th:value="${item['grade']}" required/>
                        <input type="text" name="subjectName"
                               th:value="${item['subjectName']}" required/>
                        <input type="number" name="weeklyHours" min="1"
                               th:value="${item['weeklyHours']}" required/>
                        <select name="partType" required>
                            <option th:each="part : ${partTypes}"
                                    th:value="${part}"
                                    th:selected="${part.name() == item['partType']}"
                                    th:text="${part}">MANDATORY</option>
                        </select>
                        <button type="submit" class="btn-primary">OK</button>
                    </form>
                </details>
                <button class="btn-outline-action btn-delete-requirement"
                        th:data-id="${item['id']}"
                        th:data-curriculum="${id}"
                        th:data-name="${item['subjectName']}"
                        style="color:var(--destructive);border-color:#fecaca;background:#fef2f2;">
                    Удалить
                </button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="details-footer-actions" sec:authorize="hasRole('ADMIN')">
        <button class="btn-outline-action btn-delete-curriculum"
                th:data-id="${id}"
                th:data-name="${title}"
                style="color:var(--destructive);border-color:#fecaca;background:#fef2f2;">
            Удалить
        </button>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script type="module" th:src="@{/js/federal-curriculums.js}"></script>
</th:block>
</body>
</html>
