<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Справочная информация о федеральном учебном плане">
    <title th:text="${pageTitle}">Федеральный учебный план</title>
    <link rel="stylesheet" th:href="@{/css/federal-curriculum-details.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="title-with-action">
                <span th:text="${title}">Федеральный учебный план</span>
                <a class="btn-icon-edit"
                   title="Редактировать"
                   aria-label="Редактировать"
                   sec:authorize="hasRole('ADMIN')"
                   th:href="@{/federal/curriculums/{cid}/edit(cid=${id})}">
                    <svg fill="none"
                         height="15"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24"
                         width="15"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </a>
            </h1>
            <p class="page-subtitle">Информация о федеральном учебном плане</p>
        </div>
    </div>
    <div class="school-info">
        <div class="info-row">
            <span class="info-label">ID:</span>
            <span class="info-value" th:text="${id}">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Уровень:</span>
            <span class="info-value" th:text="${level}">BASIC</span>
        </div>
        <div class="info-row">
            <span class="info-label">Неделя:</span>
            <span class="info-value" th:text="${week}">FIVE_DAYS</span>
        </div>
        <div class="info-row">
            <span class="info-label">Версия:</span>
            <span class="info-value" th:text="${version}">v1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Учебный год:</span>
            <span class="info-value" th:text="${year}">2026/2027</span>
        </div>
        <div class="info-row">
            <span class="info-label">Описание:</span>
            <span class="info-value" th:text="${description} ?: '—'">—</span>
        </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;
                margin-top:2rem;margin-bottom:.75rem;">
        <h2 style="margin:0;">Требования учебного плана</h2>
        <button class="btn-outline-action"
                id="btn-toggle-add"
                type="button">
            <svg id="toggle-add-icon"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 style="width:14px;height:14px;"
                 viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <line x1="12" x2="12" y1="5" y2="19"/>
                <line x1="5" x2="19" y1="12" y2="12"/>
            </svg>
            <span id="toggle-add-label">Добавить требование</span>
        </button>
    </div>
    <form class="req-add-panel"
          id="req-add-panel"
          method="post"
          th:action="@{/federal/curriculums/{cid}/requirements/create(cid=${id})}">
        <input name="grade"
               type="number"
               max="11"
               min="1"
               placeholder="Класс"
               required="required"/>
        <input name="subjectName"
               type="text"
               placeholder="Предмет"
               required="required"/>
        <input name="weeklyHours"
               type="number"
               min="1"
               placeholder="Часов/нед."
               required="required"/>
        <select name="partType" required="required">
            <option th:each="part : ${partTypes}"
                    th:text="${part}"
                    th:value="${part}">MANDATORY</option>
        </select>
        <button class="btn-primary" type="submit">Сохранить</button>
    </form>
    <div class="req-filter-bar">
        <input id="filter-grade"
               type="number"
               max="11"
               min="1"
               placeholder="Класс"
               style="width:90px;"/>
        <div class="search-wrap">
            <svg fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" x2="16.65" y1="21" y2="16.65"/>
            </svg>
            <input id="filter-subject"
                   type="text"
                   placeholder="Поиск по предмету..."/>
        </div>
        <select id="filter-part" style="width:auto;">
            <option value="">Все части</option>
            <option th:each="part : ${partTypes}"
                    th:text="${part}"
                    th:value="${part}">MANDATORY</option>
        </select>
    </div>
    <table class="data-table">
        <thead>
        <tr>
            <th>Класс</th>
            <th>Предмет</th>
            <th>Часов/нед.</th>
            <th>Часть</th>
            <th style="text-align:right;padding-right:1rem;">Действия</th>
        </tr>
        </thead>
        <tbody id="req-tbody">
        <tr id="req-empty-row" style="display:none;">
            <td class="empty-state" colspan="5">Требования не найдены.</td>
        </tr>
        <tr th:if="${#lists.isEmpty(requirements)}">
            <td class="empty-state" colspan="5">Требования пока не добавлены.</td>
        </tr>
        <tr class="req-data-row"
            th:data-grade="${item['grade']}"
            th:data-part="${item['partType']}"
            th:data-subject="${item['subjectName']}"
            th:each="item : ${requirements}">
            <td class="view-grade"   th:text="${item['grade']}">5</td>
            <td class="view-subject" th:text="${item['subjectName']}">Математика</td>
            <td class="view-hours"   th:text="${item['weeklyHours']}">5</td>
            <td class="view-part"    th:text="${item['partType']}">MANDATORY</td>
            <td>
                <div class="td-actions">
                    <button class="td-icon-btn req-row-edit" type="button" title="Редактировать">
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                        </svg>
                    </button>
                    <button class="td-icon-btn btn-icon-delete req-row-delete btn-delete-requirement"
                            type="button"
                            title="Удалить"
                            th:data-curriculum="${id}"
                            th:data-id="${item['id']}"
                            th:data-name="${item['subjectName']}">
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <line x1="18" x2="6" y1="6" y2="18"/>
                            <line x1="6" x2="18" y1="6" y2="18"/>
                        </svg>
                    </button>
                    <button class="td-icon-btn btn-icon-save req-row-save"
                            type="button"
                            title="Сохранить">
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-width="2.5"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </button>
                    <button class="td-icon-btn req-row-cancel"
                            type="button"
                            title="Отмена">
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <line x1="18" x2="6" y1="6" y2="18"/>
                            <line x1="6" x2="18" y1="6" y2="18"/>
                        </svg>
                    </button>
                    <form class="req-edit-form"
                          method="post"
                          style="display:none;"
                          th:action="@{/federal/curriculums/{cid}/requirements/{rid}/edit(cid=${id},rid=${item['id']})}">
                        <input class="edit-grade" name="grade" type="hidden"/>
                        <input class="edit-subject" name="subjectName" type="hidden"/>
                        <input class="edit-hours" name="weeklyHours" type="hidden"/>
                        <input class="edit-part" name="partType" type="hidden"/>
                    </form>
                </div>
            </td>
        </tr>

        </tbody>
    </table>
    <div class="pagination-wrap" id="req-pagination"></div>
    <div class="details-footer-actions" sec:authorize="hasRole('ADMIN')">
        <button class="btn-outline-action btn-delete-curriculum"
                style="color:var(--destructive);border-color:#fecaca;background:#fef2f2;"
                th:data-id="${id}"
                th:data-name="${title}">
            Удалить план
        </button>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script type="module" th:src="@{/js/federal-curriculums.js}"></script>
    <script type="module" th:src="@{/js/federal-curriculum-details.js}"></script>
</th:block>
</body>
</html>
