<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Добавление федерального учебного плана">
    <title>Новый федеральный учебный план</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content:center;">
        <div>
            <h1 style="margin:0;">Новый федеральный учебный план</h1>
            <p class="page-subtitle">Заполните метаданные плана</p>
        </div>
    </div>
    <div style="max-width:640px;margin:0 auto;">
        <form method="post"
              style="display:flex;flex-direction:column;gap:1rem;"
              th:action="@{/federal/curriculums/create}">
            <label for="title-name"
                   style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Название
                <input id="title-name"
                       name="title"
                       type="text"
                       autofocus="autofocus"
                       required="required">
                </input>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Уровень образования
                <select name="level" required="required">
                    <option th:each="level : ${levels}"
                            th:text="${level}"
                            th:value="${level}">BASIC</option>
                </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Учебная неделя
                <select name="week" required="required">
                    <option th:each="week : ${studyWeeks}"
                            th:text="${week}"
                            th:value="${week}">FIVE_DAYS</option>
                </select>
            </label>
            <label for="version-name"
                   style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Версия
                <input id="version-name"
                       name="version"
                       type="text"
                       required="required">
                </input>
            </label>
            <label for="year-name"
                   style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Учебный год
                <input id="year-name"
                       name="year"
                       type="text"
                       placeholder="2026/2027"
                       required="required">
                </input>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Описание
                <textarea name="description" rows="4"></textarea>
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a class="btn-outline-action" th:href="@{/federal/curriculums}">Отмена</a>
                <button class="btn-primary" type="submit">Создать</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
