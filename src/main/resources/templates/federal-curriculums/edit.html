<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Редактирование информации у федерального учебного плана">
    <title>Редактировать федеральный учебный план</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content:center;">
        <div>
            <h1 style="margin:0;">Редактировать федеральный учебный план</h1>
        </div>
    </div>
    <div style="max-width:640px;margin:0 auto;">
        <form method="post"
              style="display:flex;flex-direction:column;gap:1rem;"
              th:action="@{/federal/curriculums/{cid}/edit(cid=${id})}">
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Название
                <input name="title"
                       type="text"
                       autofocus
                       required
                       th:value="${title}"/>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Уровень образования
                <select name="level" required>
                    <option th:each="lvl : ${levels}"
                            th:selected="${lvl.name() == level}"
                            th:text="${lvl}"
                            th:value="${lvl}">BASIC</option>
                </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Учебная неделя
                <select name="week" required>
                    <option th:each="wk : ${studyWeeks}"
                            th:selected="${wk.name() == week}"
                            th:text="${wk}"
                            th:value="${wk}">FIVE_DAYS</option>
                </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Версия
                <input name="version" type="text" required th:value="${version}"/>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Учебный год
                <input name="year" type="text" required th:value="${year}"/>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Описание
                <textarea name="description" rows="4" th:text="${description}"></textarea>
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a class="btn-outline-action" th:href="@{/federal/curriculums/{cid}(cid=${id})}">Отмена</a>
                <button class="btn-primary" type="submit">Сохранить</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
