<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{base}"
      lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Редактирование информации у федерального учебного плана">
    <title>Редактировать федеральный учебный план</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="justify-content:center;">
        <div>
            <h1 style="margin:0;">Редактировать федеральный учебный план</h1>
        </div>
    </div>
    <div style="max-width:640px;margin:0 auto;">
        <!--
            All variables (id, title, level, week, version, year, description)
            come from ThymeleafMedia.map() added via addAllObjects() in the controller.
        -->
        <form th:action="@{/federal/curriculums/{cid}/edit(cid=${id})}" method="post"
              style="display:flex;flex-direction:column;gap:1rem;">
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Название
                <input type="text" name="title" th:value="${title}" required autofocus/>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Уровень образования
                <select name="level" required>
                    <option th:each="lvl : ${levels}"
                            th:value="${lvl}"
                            th:selected="${lvl.name() == level}"
                            th:text="${lvl}">BASIC</option>
                </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Учебная неделя
                <select name="week" required>
                    <option th:each="wk : ${studyWeeks}"
                            th:value="${wk}"
                            th:selected="${wk.name() == week}"
                            th:text="${wk}">FIVE_DAYS</option>
                </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Версия
                <input type="text" name="version" th:value="${version}" required/>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Учебный год
                <input type="text" name="year" th:value="${year}" required/>
            </label>
            <label style="display:flex;flex-direction:column;gap:.375rem;font-size:.875rem;font-weight:500;">
                Описание
                <textarea name="description" rows="4" th:text="${description}"></textarea>
            </label>
            <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:.25rem;">
                <a th:href="@{/federal/curriculums/{cid}(cid=${id})}" class="btn-outline-action">Отмена</a>
                <button type="submit" class="btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
