<!-- htmlhint-disable link-rel-canonical-require main-require -->
<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Требования федерального учебного плана">
    <title th:text="${pageTitle}">Требования учебного плана</title>
    <link rel="stylesheet" th:href="@{/css/federal-curriculum-details.css}">
</head>
<body>
<div layout:fragment="content">
    <nav class="breadcrumbs" aria-label="Навигационная цепочка">
        <a class="breadcrumb-link"
           href="/federal/curriculums"
           title="Перейти к федеральным учебным планам"
           th:href="@{/federal/curriculums}">
            Федеральные учебные планы
        </a>
        <span class="breadcrumb-separator">-&gt;</span>
        <a class="breadcrumb-link"
           href="#"
           title="Перейти к описанию учебного плана"
           th:href="@{/federal/curriculums/{cid}(cid=${id})}"
           th:text="${title}">
            Федеральный учебный план
        </a>
        <span class="breadcrumb-separator">-&gt;</span>
        <span class="breadcrumb-current">Требования</span>
    </nav>
    <div class="page-title-row" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="title-with-action">
                <span>Требования учебного плана</span>
            </h1>
            <p class="page-subtitle" th:text="${title}">Федеральный учебный план</p>
        </div>
    </div>
    <form class="req-add-panel"
          id="req-add-panel"
          method="post"
          th:action="@{/federal/curriculums/{cid}/requirements/create(cid=${id})}">
        <fieldset class="req-form-group req-add-group">
            <legend>Добавление требования</legend>
            <div class="req-form-grid req-form-grid-add">
                <label class="req-field req-field-grade" for="grade-number">
                    <input id="grade-number"
                           name="grade"
                           type="number"
                           max="11"
                           min="1"
                           placeholder="Класс"
                           required="required">
                </label>
                <label class="req-field" for="subject-name">
                    <input id="subject-name"
                           name="subjectName"
                           type="text"
                           placeholder="Предмет"
                           required="required">
                </label>
                <label class="req-field req-field-hours" for="weekly-hours">
                    <input id="weekly-hours"
                           name="weeklyHours"
                           type="number"
                           min="1"
                           placeholder="Часов/нед."
                           required="required">
                </label>
                <select name="partType" required="required">
                    <option th:each="part : ${partTypes}"
                            th:text="${part}"
                            th:value="${part}">MANDATORY</option>
                </select>
                <button class="btn-primary" type="submit">Сохранить</button>
            </div>
        </fieldset>
    </form>
    <fieldset class="req-form-group req-search-panel">
        <legend>Поиск требований</legend>
        <div class="req-form-grid req-form-grid-search">
            <label class="req-field" for="filter-grade">
                <input id="filter-grade"
                       type="number"
                       max="11"
                       min="1"
                       placeholder="Класс">
            </label>
            <label class="req-field" for="filter-subject">
                <input id="filter-subject"
                       type="text"
                       placeholder="Поиск по предмету...">
            </label>
            <select id="filter-part">
                <option value="">Все части</option>
                <option th:each="part : ${partTypes}"
                        th:text="${part}"
                        th:value="${part}">MANDATORY</option>
            </select>
        </div>
    </fieldset>
    <div id="req-results" th:fragment="requirements-results">
        <table class="data-table">
            <thead>
            <tr>
                <th>
                    <button class="req-sort-btn"
                            type="button"
                            title="Сортировать по классу"
                            th:classappend="${sortBy == 'grade'} ? ' active' : ''"
                            data-sort="grade">
                        <span>Класс</span>
                        <span class="req-sort-icon"
                              th:text="${sortBy == 'grade' ? (sortDir == 'asc' ? '↑' : (sortDir == 'desc' ? '↓' : '↕')) : '↕'}">↕</span>
                    </button>
                </th>
                <th>
                    <button class="req-sort-btn"
                            type="button"
                            title="Сортировать по предмету"
                            th:classappend="${sortBy == 'subject'} ? ' active' : ''"
                            data-sort="subject">
                        <span>Предмет</span>
                        <span class="req-sort-icon"
                              th:text="${sortBy == 'subject' ? (sortDir == 'asc' ? '↑' : (sortDir == 'desc' ? '↓' : '↕')) : '↕'}">↕</span>
                    </button>
                </th>
                <th>
                    <button class="req-sort-btn"
                            type="button"
                            title="Сортировать по часам в неделю"
                            th:classappend="${sortBy == 'hours'} ? ' active' : ''"
                            data-sort="hours">
                        <span>Часов/нед.</span>
                        <span class="req-sort-icon"
                              th:text="${sortBy == 'hours' ? (sortDir == 'asc' ? '↑' : (sortDir == 'desc' ? '↓' : '↕')) : '↕'}">↕</span>
                    </button>
                </th>
                <th>
                    <button class="req-sort-btn"
                            type="button"
                            title="Сортировать по части"
                            th:classappend="${sortBy == 'part'} ? ' active' : ''"
                            data-sort="part">
                        <span>Часть</span>
                        <span class="req-sort-icon"
                              th:text="${sortBy == 'part' ? (sortDir == 'asc' ? '↑' : (sortDir == 'desc' ? '↓' : '↕')) : '↕'}">↕</span>
                    </button>
                </th>
                <th style="text-align:right;padding-right:1rem;">Действия</th>
            </tr>
            </thead>
            <tbody id="req-tbody"
                   th:data-search-url="@{/federal/curriculums/{cid}/requirements/fragment(cid=${id})}"
                   th:fragment="requirements-rows">
            <tr id="req-empty-row" th:if="${#lists.isEmpty(requirements)}">
                <td class="empty-state" colspan="5">Требования пока не добавлены.</td>
            </tr>
            <tr class="req-data-row"
                th:data-grade="${item['grade']}"
                th:data-part="${item['partType']}"
                th:data-subject="${item['subjectName']}"
                th:each="item : ${requirements}">
                <td class="view-grade"   th:text="${item['grade']}">5</td>
                <td class="view-subject" th:text="${item['subjectName']}">Математика</td>
                <td class="view-hours"   th:text="${item['weeklyHours']}">5</td>
                <td class="view-part"    th:text="${item['partType']}">MANDATORY</td>
                <td>
                    <div class="td-actions">
                        <button class="td-icon-btn req-row-edit" type="button" title="Редактировать">
                            <svg fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 20h9"/>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                            </svg>
                        </button>
                        <button class="td-icon-btn btn-icon-delete req-row-delete btn-delete-requirement"
                                type="button"
                                title="Удалить"
                                th:data-curriculum="${id}"
                                th:data-id="${item['id']}"
                                th:data-name="${item['subjectName']}">
                            <svg fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24"
                                 xmlns="http://www.w3.org/2000/svg">
                                <line x1="18" x2="6" y1="6" y2="18"/>
                                <line x1="6" x2="18" y1="6" y2="18"/>
                            </svg>
                        </button>
                        <button class="td-icon-btn btn-icon-save req-row-save"
                                type="button"
                                title="Сохранить">
                            <svg fill="none"
                                 stroke="currentColor"
                                 stroke-width="2.5"
                                 viewBox="0 0 24 24"
                                 xmlns="http://www.w3.org/2000/svg">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </button>
                        <button class="td-icon-btn req-row-cancel"
                                type="button"
                                title="Отмена">
                            <svg fill="none"
                                 stroke="currentColor"
                                 stroke-width="2"
                                 viewBox="0 0 24 24"
                                 xmlns="http://www.w3.org/2000/svg">
                                <line x1="18" x2="6" y1="6" y2="18"/>
                                <line x1="6" x2="18" y1="6" y2="18"/>
                            </svg>
                        </button>
                        <form class="req-edit-form"
                              method="post"
                              style="display:none;"
                              th:action="@{/federal/curriculums/{cid}/requirements/{rid}/edit(cid=${id},rid=${item['id']})}">
                            <input class="edit-grade" name="grade" type="hidden">
                            <input class="edit-subject" name="subjectName" type="hidden">
                            <input class="edit-hours" name="weeklyHours" type="hidden">
                            <input class="edit-part" name="partType" type="hidden">
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pagination-wrap" id="req-pagination">
            <div class="pagination-pages">
                <a class="pagination-btn pagination-prev"
                   href="#"
                   title="Предыдущая страница"
                   th:data-limit="${limit}"
                   th:data-offset="${page - 1}"
                   th:if="${hasPrev}">
                    <svg fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         style="width:14px;height:14px;"
                         viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </a>
                <th:block th:if="${totalPages > 1}"
                          th:with="start=${page > 3 ? page - 2 : 1},end=${page + 2 <= totalPages ? page + 2 : totalPages},end=${end < 5 ? (totalPages < 5 ? totalPages : 5) : end}">
                    <th:block th:if="${start > 1}">
                        <a class="pagination-btn"
                           href="#"
                           title="Перейти на первую страницу"
                           th:data-limit="${limit}"
                           th:data-offset="1">1</a>
                        <span class="pagination-ellipsis" th:if="${start > 2}">...</span>
                    </th:block>
                    <th:block th:each="p : ${#numbers.sequence(start, end)}">
                        <a class="pagination-btn"
                           href="#"
                           title="Перейти на указанную страницу"
                           th:classappend="${p == page} ? 'active' : ''"
                           th:data-limit="${limit}"
                           th:data-offset="${p}"
                           th:text="${p}"
                           th:title="${p == page} ? 'Текущая страница' : 'Перейти на страницу ' + p">1</a>
                    </th:block>
                    <th:block th:if="${end < totalPages}">
                        <span class="pagination-ellipsis" th:if="${end < totalPages - 1}">...</span>
                        <a class="pagination-btn"
                           href="#"
                           title="Перейти на последнюю страницу"
                           th:data-limit="${limit}"
                           th:data-offset="${totalPages}"
                           th:text="${totalPages}"
                           th:title="'Перейти на последнюю страницу (' + ${totalPages} + ')'">N</a>
                    </th:block>
                </th:block>
                <a class="pagination-btn pagination-next"
                   href="#"
                   title="Следующая страница"
                   th:data-limit="${limit}"
                   th:data-offset="${page + 1}"
                   th:if="${hasNext}">
                    <svg fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         style="width:14px;height:14px;"
                         viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </a>
            </div>
            <div class="pagination-size" th:if="${limit >= 15}">
                <span class="pagination-size-label">На странице:</span>
                <a class="pagination-size-btn"
                   href="#"
                   title="Показывать по 15 элементов на странице"
                   th:classappend="${limit == s} ? 'active' : ''"
                   th:data-limit="${s}"
                   th:data-offset="1"
                   th:each="s : ${#arrays.toArray({15, 30, 50})}"
                   th:text="${s}"
                   th:title="'Показывать по ' + ${s} + ' элементов'">15</a>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script type="module" th:src="@{/js/federal-curriculums.js}"></script>
    <script type="module" th:src="@{/js/federal-curriculum-details.js}"></script>
</th:block>
</body>
</html>
