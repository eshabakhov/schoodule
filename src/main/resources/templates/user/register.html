<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <link type="image/png" rel="icon" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}">
    <meta name="description" content="Регистрация на платформе">
    <title>Регистрация — Schoodule</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="canonical" href="https://schoodule.com/users/register">
</head>
<body>
    <h1>Регистрация</h1>
    <main>
        <div class="page-container">
            <div class="login-card">
                <div class="card-header">
                    <div class="logo-wrap">
                        <svg fill="none"
                             stroke="currentColor"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             stroke-width="2"
                             viewBox="0 0 24 24"
                             xmlns="http://www.w3.org/2000/svg">
                            <rect height="18" rx="2" ry="2" width="18" x="3" y="4"/>
                            <line x1="16" x2="16" y1="2" y2="6"/>
                            <line x1="8" x2="8" y1="2" y2="6"/>
                            <line x1="3" x2="21" y1="10" y2="10"/>
                        </svg>
                    </div>
                    <div class="card-title">Schoodule</div>
                    <div class="card-desc">Создайте аккаунт для доступа к платформе</div>
                </div>
                <form class="login-form" id="register-form" method="post">
                    <div class="field">
                        <label for="username">Логин</label>
                        <input id="username"
                               name="username"
                               type="text"
                               autofocus="autofocus"
                               minlength="3"
                               placeholder="Минимум 3 символа"
                               required="required">
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email"
                               name="email"
                               type="email"
                               placeholder="email@example.com"
                               required="required">
                    </div>
                    <div class="field">
                        <label for="password">Пароль</label>
                        <div class="input-wrap">
                            <input id="password"
                                   name="password"
                                   type="password"
                                   minlength="4"
                                   placeholder="••••••••"
                                   required="required">
                            <button class="eye-btn"
                                    type="button"
                                    aria-label="Показать пароль"
                                    data-target="password">
                                <svg class="eye-icon eye-off"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-linecap="round"
                                     stroke-linejoin="round"
                                     stroke-width="2"
                                     viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" x2="23" y1="1" y2="23"/>
                                </svg>
                                <svg class="eye-icon eye-on"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-linecap="round"
                                     stroke-linejoin="round"
                                     stroke-width="2"
                                     style="display:none"
                                     viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="confirm-password">Подтверждение пароля</label>
                        <div class="input-wrap">
                            <input id="confirm-password"
                                   name="confirmPassword"
                                   type="password"
                                   minlength="4"
                                   placeholder="••••••••"
                                   required="required">
                            <button class="eye-btn"
                                    type="button"
                                    aria-label="Показать пароль"
                                    data-target="confirmPassword">
                                <svg class="eye-icon eye-off"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-linecap="round"
                                     stroke-linejoin="round"
                                     stroke-width="2"
                                     viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" x2="23" y1="1" y2="23"/>
                                </svg>
                                <svg class="eye-icon eye-on"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-linecap="round"
                                     stroke-linejoin="round"
                                     stroke-width="2"
                                     style="display:none"
                                     viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="btn-submit" type="submit">Зарегистрироваться</button>
                </form>
                <div class="alert error" id="error-message" style="display:none;"></div>
                <div class="divider"><span></span></div>
                <div class="register-link">
                    Уже есть аккаунт?
                    <a href="/users/login" title="Войти в систему">
                        Войти
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script th:src="@{/js/security.js}"></script>
    <script th:src="@{/js/authentication.js}"></script>
</body>
</html>
