<!DOCTYPE html>
<html lang="ru"
      layout:decorate="~{base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Справочная информация о школе">
    <title th:text="${pageTitle}">Информация о школе</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row" style="margin-bottom:1.5rem;">
        <div>
            <h1 class="title-with-action">
                <span th:text="${school.name()}">Название школы</span>
                <a class="btn-icon-edit"
                   title="Редактировать"
                   aria-label="Редактировать"
                   sec:authorize="hasRole('ADMIN')"
                   th:href="@{/schools/{id}/edit(id=${school.uid()})}">
                    <svg fill="none"
                         height="15"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24"
                         width="15"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                    </svg>
                </a>
            </h1>
            <p class="page-subtitle">Информация о школе</p>
        </div>
    </div>
    <div class="school-info">
        <div class="info-row">
            <span class="info-label">ID:</span>
            <span class="info-value" th:text="${school.uid()}">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Название:</span>
            <span class="info-value" th:text="${school.name()}">Школа</span>
        </div>
    </div>
    <div class="details-footer-actions" sec:authorize="hasRole('ADMIN')">
        <button class="btn-outline-action btn-delete-row"
                type="submit"
                title="Удалить"
                style="color:var(--destructive);border-color:#fecaca;background:#fef2f2;"
                th:data-id="${school.uid()}" th:data-name="${school.name()}">
            Удалить
        </button>
    </div>
</div>
<th:block layout:fragment="page-scripts">
    <script type="module" sec:authorize="hasRole('ADMIN')" th:src="@{/js/schools.js}"></script>
</th:block>
</body>
</html>
