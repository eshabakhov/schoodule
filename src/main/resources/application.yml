spring:
  application:
    name: surok
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:${db.url:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:surok}}}
    username: ${DB_USERNAME:${db.username:surok}}
    password: ${DB_PASSWORD:${db.password:local-development}}
  liquibase:
    enabled: true
    change-log: classpath:changelog/changelog.xml
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600
          cache-public: true
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YA_ID:${ya-id:local-development}}
            client-secret: ${YA_SECRET:${ya-secret:local-development}}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/yandex"
            scope:
              - login:email
              - login:info
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info?format=json
            user-name-attribute: default_email
server:
  port: 19500
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SECURITY_SECURE_COOKIE:true}
springdoc:
  api-docs:
    enabled: ${APP_SECURITY_DOCS_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${APP_SECURITY_DOCS_ENABLED:true}
    path: /swagger-ui.html
app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@mail.ru}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admiiiin0!}
  security:
    docs:
      enabled: ${APP_SECURITY_DOCS_ENABLED:true}
    prometheus:
      enabled: ${APP_SECURITY_PROMETHEUS_ENABLED:false}
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
